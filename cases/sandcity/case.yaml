name: City of Sand City — Police (POA) MOU 2024–2027
department: police

sources:
  - id: sandcity_poa_mou
    file: sources/sandcity_poa_mou.pdf
    title: Sand City POA MOU 2024–2027
    doc_type: MOU
    bargaining_unit: sandcity-police
    mou_version: SANDCITY-POA-2024
    effective_start: "2024-07-01"
    effective_end: "2027-06-30"

data:
  adapter: csv
  path: data/roster.csv
  schema:
    name: str
    rank: str
    base_hourly: float
    shift: str
    fto: bool
    bilingual: bool
    post_cert: str
    bargaining_unit: str

rules: rules/rules_ratified.json
proposed_rules: rules/rules_proposed.json
catalog: catalog.json
taxonomy: taxonomy.yaml
extraction: prompt/extraction.yaml
ledger: ledger.jsonl
snapshots: snapshots

rounding:
  places: 2
  mode: half_up

# GOLDEN CASE — one scenario an HR analyst worked out BY HAND from reading the MOU.
# No rule set may be ratified unless it reproduces this exact number. This is what
# catches rules that are schema-valid but semantically wrong.
#   Officer C (bil FTO)  48 x1.05(bilingual §3.3) x1.055(graveyard §6.1) x2.5(holiday §5.2) x8 = 1063.44
#   Sergeant C  58 x1.055 x2.5 x8 = 1223.80 · Officer B 45 x1.055 x2.5 x8 = 949.50
#   Corporal C (bil FTO) 52 x1.05 x1.055 x2.5 x8 = 1152.06
golden_case:
  name: 8-hour holiday shift, graveyard classifications
  subjects: ["Officer Step C (Graveyard, Bilingual FTO)", "Sergeant Step C (Graveyard)", "Officer Step B (Graveyard)", "Corporal Step C (Graveyard, Bilingual FTO)"]
  params:
    hours: 8
    holiday_weekday: "Sat"
  expected_total: 4388.80
