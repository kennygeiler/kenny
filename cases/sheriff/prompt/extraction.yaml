description: >
  Extract the parameters of a holdover-cost question: which officers and how many
  held-over hours.
entities:
  subjects: Officer first names or names mentioned in the prompt.
  hours: Number of held-over hours.
  day_type: The day designation referenced (e.g. High-Security Day), for context.
output_shape:
  subjects: [str]
  hours: float
  day_type: str
