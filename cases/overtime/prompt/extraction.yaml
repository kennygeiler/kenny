# Drives the run-time LLM translation layer (parse_intent). Case-specific config,
# same core code across cases (PRD 5.4 / 5.5).
description: >
  Extract the parameters of an overtime/holiday costing question: which employees,
  how many hours, and the date (with its weekday).
entities:
  subjects: Employee first names or names mentioned in the prompt.
  hours: Number of hours in the mandated shift.
  date: The calendar date referenced (free text is fine).
  holiday_weekday: Three-letter weekday abbreviation for that date, e.g. Sat.
output_shape:
  subjects: [str]
  hours: float
  date: str
  holiday_weekday: str
# Deterministic fallback (no API key): match roster names, pull an integer before
# "hour", and read a weekday named in the prompt.
